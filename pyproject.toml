[project]
name = "blendfleet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "kaggle>=2.2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
